<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계산기</title>
</head>
<body>
    <h1>사칙연산 계산기</h1>

    <p>사용 방법</p>
    <ol>
        <li>콘솔을 엽니다. (Mac: Cmd + Option + J, Windows: F12 또는 Ctrl + Shift + J)</li>
        <li>콘솔에 <code>start()</code> 를 입력하고 엔터를 누릅니다.</li>
        <li>계산식을 입력하는 창이 뜨면 식을 입력합니다. (예: 3 + 5 * 2 - 4 / 2)</li>
        <li>결과가 콘솔에 표시됩니다.</li>
    </ol>

    <script src="caculator.js"></script>
</body>
</html>
